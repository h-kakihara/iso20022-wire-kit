name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to attach signed artifacts (e.g. v0.1.0)'
        required: true
        default: 'v0.1.0'

permissions:
  contents: write

jobs:
  publish:
    name: Verify & Publish Signed Release
    runs-on: ubuntu-latest
    steps:
      - name: Resolve target tag
        id: target
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.target.outputs.tag }}

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install toolchain and run full verification
        run: |
          npm install --no-audit --no-fund
          npm run build
          npm test

      - name: Create deterministic tarball artifact
        run: npm pack

      - name: Upload tarball and SHA-256 checksum to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TARBALL=$(ls *.tgz | head -n 1)
          sha256sum "$TARBALL" > "$TARBALL.sha256"
          gh release upload "${{ steps.target.outputs.tag }}" "$TARBALL" "$TARBALL.sha256" \
            --repo "${{ github.repository }}" \
            --clobber
